name: EPG

on:
  push:
    branches: [main]
  schedule:
    - cron: '10 6 * * *'   # 06:10 UTC = 08:10 Madrid; diario
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: epg-daily
  cancel-in-progress: true

jobs:
  collect:
    name: Recopilar EPG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Dependencias Python
        run: python -m pip install -r requirements.txt

      - name: Colector de EPG (7 días)
        run: python -m collector.main --days 7 --split

      - name: Verificar metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = Path('data/metadata.json')
          if not m.exists():
              raise SystemExit('no se genero data/metadata.json')
          meta = json.loads(m.read_text())
          print(meta)
          if meta.get('status') != 'ok':
              raise SystemExit('metadata con status != ok')
          PY

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Tests de unidad (frontend puro)
        run: node --test "tests/frontend/*.test.mjs"

      - name: Cache de datos (para despliegues rápidos)
        uses: actions/cache@v6
        with:
          path: data
          key: epg-data-${{ github.run_id }}
          restore-keys: epg-data-

      - name: Empaquetar datos
        uses: actions/upload-artifact@v7
        with:
          name: epg-data
          path: |
            data/*
            data/epg/*
          retention-days: 7

  deploy:
    name: Publicar en GitHub Pages
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Descargar datos
        uses: actions/download-artifact@v8
        with:
          name: epg-data
          path: data/

      - name: Sanidad de datos
        run: |
          ls -la data
          test -f data/metadata.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v5