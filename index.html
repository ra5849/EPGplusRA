<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi EPG · Guía de TV</title>
  <meta name="description" content="Guía de programación de Movistar Plus+ (España): ahora, parrilla, favoritos, cine y deportes.">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" width="28" height="28" class="logo">
      <span class="name">Mi EPG</span>
    </div>
    <nav id="nav" class="nav" aria-label="Secciones">
      <button class="nav-btn" data-view="now">Ahora</button>
      <button class="nav-btn" data-view="favoritos">Favoritos</button>
      <button class="nav-btn" data-view="guia">Guía</button>
      <button class="nav-btn" data-view="parrilla">Parrilla</button>
      <button class="nav-btn" data-view="cine">Cine</button>
      <button class="nav-btn" data-view="deportes">Deportes</button>
      <button class="nav-btn" data-view="buscar">Buscar</button>
      <button class="nav-btn" data-view="ajustes">Ajustes</button>
    </nav>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer class="footer">
    <span id="status">Actualizando…</span>
  </footer>

  <div id="modal" class="modal" hidden>
    <button class="modal-close" data-close aria-label="Cerrar">×</button>
    <div class="modal-body">
      <div class="m-head"><h3 class="m-title"></h3><button class="fav-btn m-fav hidden-btn" hidden></button></div>
      <p class="m-sub"></p>
      <p class="m-meta"></p>
      <p class="m-desc"></p>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script>
    // Vigilante de arranque. Es un script clásico a propósito: se ejecuta incluso
    // en navegadores que no pueden interpretar los módulos (o si un módulo falla),
    // casos en los que antes la página se quedaba en «Actualizando…» para siempre.
    window.__EPG_OK = false;
    // ¿Este navegador entiende la sintaxis moderna del módulo (ES2020)? Si no,
    // el script de la app ni siquiera llega a ejecutarse y antes no se veía nada.
    window.__EPG_OLD = false;
    try { new Function('var a = null ?? 1, b = null?.x; return a;'); }
    catch (e) { window.__EPG_OLD = true; }
    window.__epgFail = function (err) {
      if (window.__EPG_OK) return;
      var app = document.getElementById('app');
      var status = document.getElementById('status');
      if (status) status.textContent = 'Error al cargar';
      if (!app) return;
      app.textContent = '';
      var box = document.createElement('div');
      box.className = 'boot-error';
      var h = document.createElement('h2');
      h.textContent = 'No se pudo cargar la guía';
      var p = document.createElement('p');
      p.textContent = window.__EPG_OLD
        ? 'Tu navegador no admite las funciones de JavaScript que necesita la app (ES2020). Actualízalo o usa Chrome, Edge, Firefox o Safari recientes.'
        : 'La app no ha terminado de arrancar. Puede ser la conexión, la caché del navegador o que el navegador sea demasiado antiguo.';
      var detalle = document.createElement('p');
      detalle.className = 'muted small';
      detalle.textContent = err && err.message ? String(err.message) : '';
      var retry = document.createElement('button');
      retry.type = 'button';
      retry.textContent = 'Reintentar';
      retry.addEventListener('click', function () { location.reload(); });
      var reset = document.createElement('button');
      reset.type = 'button';
      reset.textContent = 'Borrar caché y recargar';
      reset.addEventListener('click', function () {
        var jobs = [];
        try {
          if ('serviceWorker' in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
        } catch (e) {}
        try {
          if (window.caches) jobs.push(caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          }));
        } catch (e) {}
        Promise.all(jobs).then(function () {
          location.replace(location.pathname + '?v=' + Date.now() + location.hash);
        }, function () { location.reload(); });
      });
      box.appendChild(h);
      box.appendChild(p);
      box.appendChild(retry);
      box.appendChild(reset);
      box.appendChild(detalle);
      app.appendChild(box);
      if (err) console.error('EPG:', err);
    };
    setTimeout(function () {
      if (!window.__EPG_OK) window.__epgFail(new Error('El arranque ha tardado demasiado (8 s).'));
    }, 8000);
    window.addEventListener('unhandledrejection', function (e) { window.__epgFail(e.reason); });
  </script>
  <noscript>
    <p class="boot-error">Esta guía necesita JavaScript. Actívalo en el navegador para ver la programación.</p>
  </noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
